<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stuart Bladon — life so far, visualized as a neural network.">
    <meta name="theme-color" content="#fafaf7">
    <title>Stuart Bladon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23141412' stroke-width='2'%3E%3Cpath d='M9 9L23 16L9 23' fill='none'/%3E%3Ccircle cx='9' cy='9' r='4.5' fill='%23fff'/%3E%3Ccircle cx='9' cy='23' r='4.5' fill='%23fff'/%3E%3Ccircle cx='23' cy='16' r='4.5' fill='%23141412'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stuart Bladon</h1>
            <p class="subtitle">Life so far</p>
            <nav class="social-links">
                <a href="https://github.com/recozers" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/stuart-bladon-8a912520b/" target="_blank">LinkedIn</a>
                <a href="https://x.com/BladonStuart" target="_blank">Twitter</a>
                <a href="https://stuartbladon.substack.com" target="_blank">Substack</a>
            </nav>
        </header>

        <div class="canvas-container">
            <canvas id="neuralNetwork"></canvas>
        </div>

        <div id="tooltip" class="tooltip"></div>

        <!-- Modal for detailed node view -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div class="modal-header">
                    <span class="modal-category" id="modalCategory"></span>
                    <h2 id="modalTitle"></h2>
                    <span class="modal-year" id="modalYear"></span>
                </div>
                <div class="modal-body">
                    <p id="modalDetails"></p>
                    <div class="modal-links" id="modalLinks"></div>
                </div>
                <div class="modal-connections">
                    <div class="connection-group" id="connectionFrom">
                        <span class="connection-label">Built from:</span>
                        <div class="connection-nodes" id="fromNodes"></div>
                    </div>
                    <div class="connection-group" id="connectionTo">
                        <span class="connection-label">Led to:</span>
                        <div class="connection-nodes" id="toNodes"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p class="hint-desktop">Hover or tap a node for details</p>
            <p class="hint-mobile">Swipe sideways &bull; Tap a node for details</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="neural-network.js"></script>
</body>
</html>
